name: Release Build Status

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build all current targets even if their latest SHA already passed."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  prepare-release-build-targets:
    name: Prepare Release Build Targets
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.targets.outputs.count }}
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Find changed targets
        id: targets
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const force = context.eventName === "workflow_dispatch" && core.getInput("force") === "true";
            const statusContexts = [
              "Release Build Status / Linux Release Build",
              "Release Build Status / Windows Release Build"
            ];

            async function alreadyPassed(sha) {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner,
                repo,
                ref: sha,
                per_page: 100
              });

              return statusContexts.every((statusContext) => {
                const status = statuses.find((candidate) => candidate.context === statusContext);
                return status && status.state === "success";
              });
            }

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: defaultBranch });
            const candidates = [{
              kind: "main",
              label: defaultBranch,
              ref: defaultBranch,
              sha: branch.data.commit.sha
            }];

            const targets = [];
            for (const candidate of candidates) {
              if (force || !(await alreadyPassed(candidate.sha))) {
                targets.push(candidate);
              }
            }

            core.setOutput("count", String(targets.length));
            core.setOutput("targets", JSON.stringify(targets));

            if (targets.length === 0) {
              core.info("No changed targets need a release build.");
            } else {
              for (const target of targets) {
                core.info(`Queued ${target.label} at ${target.sha}.`);
              }
            }

  linux-release-build:
    name: Linux Release Build
    runs-on: ubuntu-latest
    needs:
      - prepare-release-build-targets
    if: needs.prepare-release-build-targets.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-release-build-targets.outputs.targets) }}

    steps:
      - name: Mark Linux build pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ matrix.target.sha }}",
              state: "pending",
              context: "Release Build Status / Linux Release Build",
              description: "Linux release build queued for ${{ matrix.target.label }}.",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.ref }}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            pkg-config \
            libvulkan-dev \
            xorg-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev

      - name: Configure
        run: >
          cmake -S . -B build/linux-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Mark Linux build result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ matrix.target.sha }}",
              state,
              context: "Release Build Status / Linux Release Build",
              description: `Linux release build ${state} for ${{ matrix.target.label }}.`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  windows-release-build:
    name: Windows Release Build
    runs-on: windows-latest
    needs:
      - prepare-release-build-targets
    if: needs.prepare-release-build-targets.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-release-build-targets.outputs.targets) }}

    steps:
      - name: Mark Windows build pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ matrix.target.sha }}",
              state: "pending",
              context: "Release Build Status / Windows Release Build",
              description: "Windows release build queued for ${{ matrix.target.label }}.",
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.ref }}
          submodules: recursive

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure
        run: cmake -S . -B build/windows-release -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build/windows-release --config Release --parallel

      - name: Mark Windows build result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ matrix.target.sha }}",
              state,
              context: "Release Build Status / Windows Release Build",
              description: `Windows release build ${state} for ${{ matrix.target.label }}.`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  release-builds-successful:
    name: Release Builds Successful
    runs-on: ubuntu-latest
    needs:
      - prepare-release-build-targets
      - linux-release-build
      - windows-release-build
    if: always()

    steps:
      - name: Require successful release builds
        env:
          TARGET_COUNT: ${{ needs.prepare-release-build-targets.outputs.count }}
          PREPARE_RESULT: ${{ needs.prepare-release-build-targets.result }}
          LINUX_RESULT: ${{ needs.linux-release-build.result }}
          WINDOWS_RESULT: ${{ needs.windows-release-build.result }}
        run: |
          if [ "$PREPARE_RESULT" != "success" ]; then
            echo "Release build target preparation result: $PREPARE_RESULT"
            exit 1
          fi

          if [ "$TARGET_COUNT" = "0" ]; then
            echo "No changed targets needed a release build."
            exit 0
          fi

          if [ "$LINUX_RESULT" != "success" ] || [ "$WINDOWS_RESULT" != "success" ]; then
            echo "Linux Release Build result: $LINUX_RESULT"
            echo "Windows Release Build result: $WINDOWS_RESULT"
            exit 1
          fi

          echo "Linux and Windows Release builds passed."
