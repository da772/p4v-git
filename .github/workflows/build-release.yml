name: Build Release Artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            ninja-build \
            pkg-config \
            libvulkan-dev \
            xorg-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev

      - name: Configure
        run: >
          cmake -S . -B build/linux-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Prepare artifact
        run: |
          mkdir -p artifacts/linux
          cp build/linux-release/p4v-git artifacts/linux/p4v-git-linux
          chmod +x artifacts/linux/p4v-git-linux

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: p4v-git-linux-release
          path: artifacts/linux/p4v-git-linux
          if-no-files-found: error

  windows:
    name: Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure
        run: cmake -S . -B build/windows-release -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build/windows-release --config Release --parallel

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null
          Copy-Item build/windows-release/Release/p4v-git.exe artifacts/windows/p4v-git-windows.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: p4v-git-windows-release
          path: artifacts/windows/p4v-git-windows.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p4v-git-*-release
          path: release-artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          safe_branch="$(printf '%s' "$BRANCH_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          tag_name="release-${safe_branch}-${GITHUB_RUN_NUMBER}"
          release_notes="Release artifacts built from branch \`${BRANCH_NAME}\`."

          gh release create "$tag_name" \
            --title "$BRANCH_NAME" \
            --notes "$release_notes" \
            --target "$GITHUB_SHA" \
            release-artifacts/*
